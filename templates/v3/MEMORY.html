<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEMORY.html - Workflow v3 decision history</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#60708a;--line:#ced6e3;--accent:#275dad}
    @media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#182235;--text:#edf3ff;--muted:#a9b8ce;--line:#394861;--accent:#8ab4ff}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}
    main{max-width:980px;margin:auto;padding:32px 20px 64px}header,section,article,footer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
    .guidance{color:var(--muted)}.value{border-left:3px solid var(--accent);padding-left:12px}
  </style>
</head>
<body data-workflow-doc="MEMORY" data-schema-version="3" data-template-status="canonical">
<main>
  <header><h1>MEMORY.html</h1><p>决策演变档案；当前状态以 STATUS 为准。</p><div class="field" data-field="instance-status"><p class="value" data-value="true" data-empty="false">canonical-template</p></div></header>
  <section><h2>索引</h2><div class="field" data-field="memory-index"><ul class="value" data-value="true" data-empty="true"><li>待填写</li></ul></div></section>
  <article data-entry-template="history" data-entry-id="YYYYMMDD-topic" data-example="true">
    <h2>YYYY-MM-DD 事件</h2>
    <div class="field" data-field="history-status"><p class="value" data-value="true" data-empty="true">待填写</p></div>
    <div class="field" data-field="history-decision"><p class="value" data-value="true" data-empty="true">待填写</p></div>
    <div class="field" data-field="history-reason"><p class="value" data-value="true" data-empty="true">待填写</p></div>
    <div class="field" data-field="history-evidence"><p class="value" data-value="true" data-empty="true">待填写</p></div>
  </article>
  <footer><div class="field" data-field="last-verified-at"><p class="value" data-value="true" data-empty="true">待填写</p></div></footer>
</main>
</body>
</html>
