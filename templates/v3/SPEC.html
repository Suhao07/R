<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPEC.html - Workflow v3 stable plan</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#60708a;--line:#ced6e3;--accent:#275dad}

    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}
    main{max-width:980px;margin:auto;padding:32px 20px 64px}header,section,footer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
    h1,h2,h3{line-height:1.25}code{color:var(--accent)}.guidance{color:var(--muted)}.value{border-left:3px solid var(--accent);padding-left:12px}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
  </style>
</head>
